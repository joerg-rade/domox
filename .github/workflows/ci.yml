# Guardrail: keep the master build green on every push/PR.
#
# Scope: domox-domain plus its upstream domox-adapter (the `-am` flag builds/tests both).
# These modules' unit tests are pure JVM tests (153 in domox-domain) with NO external service
# requirement — exactly what has been proven green locally.
#
# domox-webapp is intentionally NOT in this job: its `*Test.java` include five Testcontainers
# integration tests (CorpusCandidateDedupIntegTest, DeleteCorpusIntegTest,
# ReviewMcpToolsIntegTest, ValidateDomainModelIntegTest, Smoke_IntegTest) that boot the app
# against a Postgres container.  Wire those into a separate Docker-capable job if you want
# them gating CI.
#
# Schema drift: scripts/check-schema-drift.sh is a DEV-DB guardrail, not a CI check — it diffs
# the grown local `domox-db` against the committed create-tables.sql, and against a fresh CI DB
# every table would be reported missing.  Run it locally after entity changes:
#   bash scripts/check-schema-drift.sh
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # -am builds and tests upstream domox-adapter too; mirrors the locally-proven command.
      - name: Run unit tests (domain + adapter)
        run: mvn -B -q test -pl domox-domain -am