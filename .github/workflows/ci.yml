# Guardrail: keep the master build green on every push/PR.
#
# Jobs:
#   test              — domox-domain + upstream domox-adapter unit tests. NOTE: domox-adapter's
#                       NLP tests spin a Testcontainers CoreNLP (graham3333/corenlp-complete),
#                       so this job also needs Docker (default on ubuntu-latest).
#   integration-test  — domox-webapp Testcontainers tests booting the full Spring context
#                       against a fresh Postgres container (Docker is available on
#                       ubuntu-latest). Includes ValidateDomainModelIntegTest, the metamodel
#                       veto guardrail that catches entity-member bugs such as Lombok @Data
#                       exposing an injected @DomainService as a property.
#
# Schema drift: scripts/check-schema-drift.sh is a DEV-DB guardrail, not a CI check — it diffs
# the grown local `domox-db` against the committed create-tables.sql, and against a fresh CI DB
# every table would be reported missing.  Run it locally after entity changes:
#   bash scripts/check-schema-drift.sh
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # -am builds and tests upstream domox-adapter too; mirrors the locally-proven command.
      - name: JavaScript syntax check (hand-edited .mjs files)
        run: |
          for f in $(find . -path '*/node_modules' -prune -o -name '*.mjs' -print); do
            node --check "$f" || exit 1
          done
      # Causeway silently discards a *.layout.xml that breaks its structural rules (the page then
      # falls back to the span-4 default grid, with only a buried boot-log ERROR as evidence).
      - name: Layout XML structure (unreferencedCollections marker, properties inside fieldSets)
        run: bash scripts/check-layout-xml.sh
      - name: Run unit tests (domain + adapter)
        run: mvn -B -q test -pl domox-domain -am

      # The adapter's full suite needs containers (Kroki / CoreNLP); the RDF/OWL retrieval test is
      # container-free, so run it by name — it covers the Jena adapter plus the D3 JSON mapping.
      # UmlLayoutIntegrityTest is container-free too, and asserts the UML diagram GEOMETRY invariants
      # over the real ontology.ttl (arrow tips on box edges, no backtracks, no leaked points).
      - name: Run RDF adapter tests (container-free)
        run: mvn -B -q test -pl domox-adapter -Dtest=JenaRdfAdapterTest,UmlLayoutIntegrityTest -am -Dsurefire.failIfNoSpecifiedTests=false

      # Guards the trap that has broken startup twice: this pom overrides spring-boot.version,
      # which the Causeway parent chain also pins — drift mixes releases on the classpath and
      # fails at startup, not at build time.  Runs after the Maven step so ~/.m2 is populated.
      - name: Dependency alignment (pom vs Causeway parent BOM)
        run: bash scripts/check-dependency-alignment.sh

      # Renders the real list-cell markup in headless Chromium and asserts the user-visible
      # behaviour of the D3 graph column (content on screen, popup only over the graph column,
      # stable row height).  Skips itself (exit 0) when no browser binary is available.
      - name: UI render check (headless browser)
        run: bash scripts/verify-ui-render.sh

      # Renders a UML payload in headless Chromium and asserts the STATIC renderer draws the boxes,
      # the generalization's arrow marker and the legend — the client half of the geometry invariants
      # UmlLayoutIntegrityTest asserts on the server side.  Skips itself (exit 0) without a browser.
      - name: UML render check (headless browser)
        run: bash scripts/verify-uml-render.sh

      # Renders a force-layout ontology payload and asserts the client draws the node label — name,
      # <<POS>>, and the FOURTH line, the source reference ontology (gist, Schema.org, …) — including
      # that a node with no ontology draws no fourth line.  Skips itself (exit 0) without a browser.
      - name: Ontology render check (headless browser)
        run: bash scripts/verify-ontology-render.sh

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # CoreNLP-free subset of the *IntegTest classes. ValidateDomainModelIntegTest is the
      # metamodel-veto guardrail (boot-time DomainModelValidator); ReviewMcpToolsIntegTest,
      # DeleteCorpusIntegTest, Smoke_IntegTest, CorpusOntologyDiagramIntegTest and
      # OntologyDiagramIntegTest need only Postgres. CorpusCandidateDedupIntegTest is intentionally
      # NOT here: it calls the real Stanford CoreNLP service (docker domox-nlp-1, localhost:8999)
      # and needs a fresh DB — run it locally with that container up.
      # surefire.failIfNoSpecifiedTests=false keeps the upstream modules (no matching test
      # classes) from failing the build.
      # run must be a LITERAL block scalar (`|`), NOT a plain scalar with `\` continuations:
      # YAML folds plain-scalar newlines into spaces, so "\ ⏎ -Dtest=..." becomes "\ -Dtest=..."
      # on one line; the shell then treats "\ " as an escaped space and glues a leading space
      # onto the token → Maven: "Unknown lifecycle phase ' -Dtest=...'". `|` preserves the
      # newlines, so the backslash continuations work exactly as they do in a local shell.
      - name: Run webapp integration tests (CoreNLP-free)
        run: |
          mvn -B test -pl domox-webapp -am \
            -Dtest=ValidateDomainModelIntegTest,ReviewMcpToolsIntegTest,DeleteCorpusIntegTest,Smoke_IntegTest,HexagonalPortWiringIntegTest,CorpusOntologyDiagramIntegTest,OntologyDiagramIntegTest,StaleComponentRecoveryListenerTest,StaleComponentRecoveryEndToEndTest \
            -Dsurefire.failIfNoSpecifiedTests=false