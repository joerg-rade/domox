  nlp:
    build:
      context: docker/corenlp/
      dockerfile: Dockerfile
    image: corenlp:latest
    ports:
      - "8999:9000"
    environment:
      - JVM_OPTS=-Xmx4g

  db:
    image: postgres:18-alpine
    container_name: domox-db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    ports:
      - "5432:5432"

  kroki:
    build:
      context: ./docker/kroki
      dockerfile: Dockerfile
    ports:
      - "8001:8000"

  fuseki:
    build:
      # The Dockerfile pre-loads domox-domain/src/main/resources/ontology.ttl, so the build
      # context must be the REPOSITORY ROOT (not docker/fuseki/).
      context: .
      dockerfile: docker/fuseki/Dockerfile
    ports:
      - "3030:3030"
