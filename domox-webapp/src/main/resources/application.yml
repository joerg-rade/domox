#
# Recommend use for static configuration that does not change between environments.
#
# See also config/application.properties
#
causeway:

  applib:
    annotation:
      action:
        explicit: true
        command-publishing: ignore_safe
        execution-publishing: all
      action-layout:
        css-class:
          patterns:
            delete.*:btn-danger,
            discard.*:btn-warning,
            remove.*:btn-warning
      domain-object:
        auditing: all
        publishing: all
      property:
        command-publishing: all
        execution-publishing: all

  core:
    meta-model:
      introspector:
        lock-after-full-introspection: true
        class-exclusions: domox.nlp.**
      validator:
        allow-deprecated: false
        no-params-only: true
        explicit-object-type: true

    runtime-services:
      translation:
        po:
          mode: disabled

  viewer:
    wicket:
      application:
        about: Simple App
        brand-logo-header: images/domox_logo_48.svg
        css: css/application.css
        favicon-url: images/favicon.png
        js: scripts/application.js
        #menubars-layout-xml: menubars.layout.xml
        name: DoMoX
        version: ^project.version^


        # https://stackoverflow.com/a/38983935/56880

      credit:
        - url: http://causeway.apache.org
          image: images/apache-causeway/logo-48x48.png
          name: Apache Causeway

      themes:
        show-chooser: false

      max-title-length-in-standalone-tables: 0
      max-title-length-in-parented-tables: 0

      bookmarked-pages:
        show-chooser: false
        show-drop-down-on-footer: true

  persistence:
    schema:
      auto-create-schemas: domox
      create-schema-sql-template: "CREATE SCHEMA IF NOT EXISTS %S"
      #create-schema-sql-template: "DROP SCHEMA IF EXISTS %S CASCADE; CREATE SCHEMA %S;"


resteasy:
  jaxrs:
    app:
      registration: beans
    defaultPath: "/restful"

server:
  max-http-request-header-size: 16KB

spring:
  banner:
    location: banner.txt
  main:
    web-application-type: SERVLET
  datasource:
    driverClassName: org.postgresql.Driver
    # Exclude Spring Boot 4.0.0-M3 autoconfiguration classes that are incompatible with Spring Boot 3.5.13
    #  autoconfigure:
    #   exclude:
    #      - org.springframework.boot.actuate.autoconfigure.health.HealthIndicatorsSupplier
    #     - org.springframework.boot.actuate.autoconfigure.tracing.TracingAutoConfiguration

  quartz:
    job-store-type: memory

management:
  endpoint:
    health:
      enabled: true

app:
  simple-module:
    types:
      name:
        validation:
          message: "'{character}' is invalid."
          prohibited-characters: "&%$!"

domox:
  nlp:
    disabled-rules: TDR30, TDR31
    auxiliary-verbs: be, am, is, are, was, were, been, being, have, has, had, having, do, does, did, doing
    modal-verbs: can, could, may, might, shall, should, will, would, must
    # TDR27
    user-input-verbs: input, enter, save, fill, click, select, add, record, store, process, validate, choose, pick, create, update, edit, change, modify, remove, delete, discard
    # TDR28
    system-output-verbs: display, output, retrieve, show, view, print, calculate, update, delete, search, modify, edit, remove, generate, prepare, send, get, execute, run, perform, start, stop, finish, complete
    # TDR29
    action-verbs: get, send, prepare, generate, calculate, compute, execute, run, perform, start, stop, finish, complete, contain, exclude
    #FIXME TDR30/31 have no hits, because lemmas are used
    # TDR30 — past-tense forms of user-input verbs
    #input-past-verbs: inputted, entered, filled, clicked, selected, added, recorded, processed, validated, chosen, picked, created, updated, edited, changed, modified, removed, deleted, discarded
    input-past-verbs:
    # TDR31 — past-tense forms of system-output verbs
    #output-past-verbs: displayed, outputted, retrieved, showed, viewed, printed, calculated, updated, deleted, searched, modified, edited, removed, generated, prepared, sent, got, executed, ran, performed, started, stopped, finished, completed
    output-past-verbs:
    #TDR32
    # user-input-verbs, system-output-verbs,
    # TDR33
    receive-verbs: receive, accept, get, obtain, acquire, redeem, collect, fetch, download
    # TDR34
    exception-terms: error, fail, wrong, invalid, incorrect, unable, able, exception, problem, issue, fault, bug, crash, halt, stop, terminate
    # TDR37
    control-flow-verbs: continue, restart, go, repeat, cancel, exit, quit
    # TDR38
    customer-actors: user, customer, owner, person, people, shopper, client, buyer, visitor, consumer, subscriber, member, guest
    # TDR38 — be-verb forms used by the copula check (subset of auxiliary-verbs)
    copula-be-verbs: am, is, are, was, were, be, been, being
    indefinite-articles: a, an
    # TDR38/TDR39 — terms indicating a generalization of kind
    kind-type-sort-terms: kind, type, sort
    # TDR40 — generic/evaluative adjectives that should NOT trigger adjectival generalization
    generalization-stop-adjectives: good, bad, new, old, big, small, large,
                                    high, low, fast, slow, simple, complex,
                                    easy, hard, difficult, important, necessary,
                                    valid, invalid, active, inactive, enabled, disabled,
                                    required, optional, available, correct, incorrect,
                                    true, false, first, last, next, previous
    # TDRxx
    control-flow-terms: next, previous, back, forward
    # TDR39 - generic service concepts (domain-specific service nouns are detected via negation)
    service-nouns: service, product, booking, reservation, subscription, membership, shipment, delivery
    # TDR4/TDR5 — verbs whose direct-object nouns become attributes even when not basic
    blocked-verbs: entered, inputted, saved, added, has
    basic-attributes: name, number, type, address, level, date, time,
                        id, code, status, description, title, label, value,
                        amount, quantity, size, color, email, phone, username,
                        password, comment, note, version, category, priority,
                        created-date, modified-date
    # Archetype keyword lists (Coad 1999) used by ClassArchetypeClassifier
    archetype-moment-interval-keywords: order, sale, purchase, rental, lease, booking, reservation,
                                        appointment, transaction, payment, invoice, receipt, claim,
                                        request, application, registration, subscription, shipment,
                                        delivery, checkout, return, refund, session, log,
                                        audit, history, event, activity, task, job, process
    archetype-role-keywords: customer, client, buyer, seller, vendor, supplier,
                             employee, employer, manager, supervisor, agent,
                             member, subscriber, user, owner, tenant, landlord,
                             patient, doctor, nurse, student, teacher, instructor,
                             guest, host, participant, attendee, applicant,
                             representative, delegate, trustee, beneficiary
    archetype-description-keywords: catalog, category, type, kind, sort, class, group,
                                    label, tag, status, state, phase, stage, grade,
                                    model, make, brand, product, item, plan, tariff,
                                    rate, price, fee, description, specification, template,
                                    pattern, profile, configuration, setting, preference
    # Noun-type lexicon (Höhn 2003) — structured classification used by NounTypeLexicon
    # GENERIC_ATTRIBUTE — always treated as attributes, never entities
    noun-type-generic-attributes: name, number, type, address, level, date, time,
                                    id, code, status, description, title, label, value,
                                    amount, quantity, size, color, email, phone, username,
                                    password, comment, note, version, category, priority,
                                    created-date, modified-date
    # ROLE_NOUN — roles played by persons or things
    noun-type-role-nouns: customer, user, client, buyer, seller, vendor, supplier,
                            employee, employer, manager, supervisor, agent,
                            member, subscriber, owner, tenant, landlord,
                            patient, doctor, nurse, student, teacher,
                            guest, host, participant, applicant, representative
    # DOMAIN_ENTITY — core domain nouns (primary entity candidates)
    noun-type-domain-entities: order, product, invoice, receipt, payment, shipment,
                                delivery, booking, reservation, subscription,
                                account, policy, claim, request, application
    # ABSTRACT_CONCEPT — qualities, states, or measurements
    noun-type-abstract-concepts: status, priority, level, state, phase, stage, grade,
                                    rating, score, rank, degree, intensity, quality
    # LOCATION — geographic or structural places
    noun-type-locations: address, office, warehouse, store, branch, site, location,
                            building, room, department, division, region, zone, area
    # TEMPORAL — time-related nouns
    noun-type-temporals: date, time, duration, timestamp, period, interval,
                            deadline, schedule, calendar, year, month, week, day
    # COLLECTION — collective nouns
    noun-type-collections: list, set, group, collection, array, batch, queue,
                            stack, registry, catalog, portfolio
  kroki:
    host: localhost
    port: 8001
